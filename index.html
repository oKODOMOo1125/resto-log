/* ===================== CLOSE DAY ===================== */
async function attemptCloseDay(){
  const day=CUR_DAY, ctx=CUR_CTX;
  const issues=closeCheckIssues(day,ctx);
  if(issues.length===0){ await doCloseDay(); return; }
  const mt=mealTotal(ctx.meals), et=expenseTotal(ctx.expenses);
  const total=(day.remainingCash||0)+et+mt;
  const hasAll=day.remainingCash!=null && day.posCash!=null;
  const diff=hasAll?total-day.posCash:null;
  let diffLine='';
  if(hasAll) diffLine = diff===0?'ผลต่าง: ✅ ตรง' : diff>0?`ผลต่าง: ⬆️ เกิน ${fmtMoney(diff)}`:`ผลต่าง: ⬇️ ขาด ${fmtMoney(Math.abs(diff))}`;
  openDialog(`<h3>ยังมีรายการค้างอยู่</h3>
    ${issues.map(i=>`<div class="issue">• ${i.text}</div>`).join('')}
    ${diffLine?`<div class="issue" style="margin-top:8px;"><b>${diffLine}</b></div>`:''}
    <div class="btnrow"><button class="btn secondary" id="cd-back">กลับไปแก้</button><button class="btn primary" id="cd-continue">ปิดยอดต่อ</button></div>`);
  document.getElementById('cd-back').onclick=closeDialog;
  document.getElementById('cd-continue').onclick=async()=>{ closeDialog(); await doCloseDay(); };
}
async function doCloseDay(){
  CUR_DAY.status='closed'; CUR_DAY.closedAt=nowISO();
  await dbPut('days',CUR_DAY);
  await renderToday();
  toast('ปิดยอดแล้ว');
}

/* ===================== HISTORY ===================== */
async function renderHistory(){
  let days=await dbGetAll('days');
  days.sort((a,b)=> a.date<b.date?1:-1);
  const list=document.getElementById('hist-list');
  const rows=[];
  for(const day of days){
    const ctx=await dayCtx(day.id);
    const mt=mealTotal(ctx.meals), et=expenseTotal(ctx.expenses);
    const total=(day.remainingCash||0)+et+mt;
    const hasAll=day.remainingCash!=null&&day.posCash!=null;
    const diff=hasAll?total-day.posCash:null;
    if(histFiltOpen && day.status!=='open') continue;
    if(histFiltDiff && !(day.status==='closed'&&hasAll&&diff!==0)) continue;
    let badge;
    if(day.status==='open') badge=`<span class="badge-open">ยังไม่ปิด</span>`;
    else if(!hasAll) badge=`<span class="badge-open">ปิดแล้ว</span>`;
    else if(diff===0) badge=`<span class="badge-ok">✅ ตรง</span>`;
    else if(diff>0) badge=`<span class="badge-over">⬆️ เกิน ${fmtMoney(diff)}</span>`;
    else badge=`<span class="badge-under">⬇️ ขาด ${fmtMoney(Math.abs(diff))}</span>`;
    const abnormal = day.float!==SETTINGS.defaultFloat;
    let reasonLine='';
    if(hasAll && diff!==0){
      reasonLine = day.diffReason
        ? `<div class="sub">สาเหตุ: ${escapeHtml(day.diffReason)}</div>`
        : `<div class="sub" style="color:var(--warn);">ยังไม่ได้บันทึกสาเหตุ</div>`;
    }
    rows.push(`<div class="hist-row" data-date="${day.date}">
      <div><div class="d">${fmtDateThaiShort(day.date)} · ${THAI_WD_S[dowOf(day.date)]}</div>

  list.querySelectorAll('[data-date]').forEach(r=>r.onclick=async()=>{
    await gotoTab('today'); await renderDate(r.dataset.date); jumpToSection('closing');
  });
}

/* ===================== SUMMARY ===================== */
function periodRange(){
  const today=todayISO();
  if(sumPeriod==='week'){
    const d=dateFromISO(today); const dow=(d.getDay()+6)%7; // 0=Mon
    const mon=addDaysISO(today,-dow); const sun=addDaysISO(mon,6);
    return [mon,sun];
  }
  if(sumPeriod==='month'){
    const d=dateFromISO(today);
    const first=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
    const last=new Date(d.getFullYear(),d.getMonth()+1,0);
    return [first, localISOFromDate(last)];
  }
  if(sumPeriod==='lastmonth'){
    const d=dateFromISO(today); const m=d.getMonth()-1, y=m<0?d.getFullYear()-1:d.getFullYear(), mm=(m+12)%12;
    const first=`${y}-${String(mm+1).padStart(2,'0')}-01`;
    const last=new Date(y,mm+1,0);
    return [first, localISOFromDate(last)];
  }
  return [sumFrom||today, sumTo||today];
}

async function renderSummary(){
  const [from,to]=periodRange();
  const allDays=await dbGetAll('days');
  const days=allDays.filter(d=>d.date>=from&&d.date<=to).sort((a,b)=>a.date<b.date?-1:1);
  const host=document.getElementById('sum-body');
  if(days.length===0){ host.innerHTML='<div class="empty-hint" style="padding:30px 0;">ไม่มีข้อมูลในช่วงนี้</div>'; return; }

  let mealSum=0, expSum=0, wageSum=0, closedOk=0, closedUnder=0, closedOver=0, diffSum=0;
  const topExpense={}; const catTally={}; const leaveCount={}; const workCount={}; const reasonTally={};
  const mismatchDays=[];
  const dailyMeal=[], dailyExp=[];
  for(const day of days){
    const ctx=await dayCtx(day.id);
    const mt=mealTotal(ctx.meals), et=expenseTotal(ctx.expenses);
    mealSum+=mt; expSum+=et;
    dailyMeal.push(mt); dailyExp.push(et);
    for(const e of ctx.expenses){
      if(e.category==='parkingWage'){ wageSum+=e.amount; topExpense[e.name]=(topExpense[e.name]||0)+e.amount; continue; }
      if(e.status==='advance') continue; // not settled yet — no real per-item amounts to attribute
      for(const it of expenseItems(e)){
        topExpense[it.name]=(topExpense[it.name]||0)+it.amount;
        if(it.category) catTally[it.category]=(catTally[it.category]||0)+it.amount;
      }
    }
    for(const m of ctx.meals){
      if(m.status==='leave') leaveCount[m.nameSnapshot]=(leaveCount[m.nameSnapshot]||0)+1;
      const staff=m.staffId?STAFF.find(s=>s.id===m.staffId):null;
      const isPT = m.staffId===null || (staff&&staff.type==='frequent');
      if(isPT && m.status!=='off') workCount[m.nameSnapshot]=(workCount[m.nameSnapshot]||0)+1;
    }
    if(day.status==='closed' && day.remainingCash!=null && day.posCash!=null){
      const total=day.remainingCash+et+mt; const diff=total-day.posCash;
      diffSum+=diff;
      if(diff===0) closedOk++; else if(diff<0) closedUnder++; else closedOver++;
      if(diff!==0){
        mismatchDays.push({date:day.date,diff,reason:day.diffReason||''});
        const key=day.diffReason?day.diffReason:'ยังไม่ได้บันทึกสาเหตุ';
        reasonTally[key]=(reasonTally[key]||0)+1;
      }
    }
  }
  mismatchDays.sort((a,b)=>a.date<b.date?1:-1);
  const reasonRows=Object.entries(reasonTally).sort((a,b)=>b[1]-a[1]);
  const n=days.length;
  const top5=Object.entries(topExpense).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const catRows=Object.entries(catTally).sort((a,b)=>b[1]-a[1]);
  const leaveRows=Object.entries(leaveCount).sort((a,b)=>b[1]-a[1]);
  const workRows=Object.entries(workCount).sort((a,b)=>b[1]-a[1]);

  function bars(vals,color){
    const max=Math.max(1,...vals);
    const w=100/vals.length;
    const bars=vals.map((v,i)=>{ const h=Math.max(2,v/max*54); return `<rect x="${i*w+w*0.15}" y="${58-h}" width="${w*0.7}" height="${h}" fill="${color}" rx="1.5"></rect>`; }).join('');
    return `<svg viewBox="0 0 100 60" preserveAspectRatio="none" style="height:70px;">${bars}<line x1="0" y1="58" x2="100" y2="58" stroke="var(--line)" stroke-width="0.5"/></svg>`;
  }

  host.innerHTML=`
    <div class="statgrid">
      <div class="stat"><div class="k">จำนวนวันที่ร้านเปิด</div><div class="v">${n} <small>วัน</small></div></div>
      <div class="stat"><div class="k">ค่าจ้างโบกรถรวม</div><div class="v tnum">${fmtMoney(wageSum)}</div></div>
      <div class="stat"><div class="k">ค่าข้าวรวม</div><div class="v tnum">${fmtMoney(mealSum)} <small>เฉลี่ย ${fmtMoney(mealSum/n)}/วัน</small></div></div>
      <div class="stat"><div class="k">ค่าใช้จ่ายรวม</div><div class="v tnum">${fmtMoney(expSum)} <small>เฉลี่ย ${fmtMoney(expSum/n)}/วัน</small></div></div>
    </div>
    <div class="subgroup-label">ค่าใช้จ่ายรายวัน</div>
    <div class="chart">${bars(dailyExp,'var(--accent)')}</div>
    <div class="subgroup-label">ค่าข้าวรายวัน</div>
    <div class="chart">${bars(dailyMeal,'var(--info)')}</div>
    <div class="subgroup-label">5 รายการค่าใช้จ่ายสูงสุด</div>
    ${top5.length? top5.map(([nm,v])=>`<div class="toprow"><span>${escapeHtml(nm)}</span><span class="tnum">${fmtMoney(v)}</span></div>`).join('') : '<div class="empty-hint">ไม่มีข้อมูล</div>'}
    ${catRows.length?`<div class="subgroup-label">ค่าใช้จ่ายตามหมวด</div>
    ${catRows.map(([nm,v])=>`<div class="toprow"><span>${escapeHtml(nm)}</span><span class="tnum">${fmtMoney(v)}</span></div>`).join('')}`:''}
    <div class="subgroup-label">การปิดยอด</div>
    <div class="toprow"><span>ตรง</span><span class="tnum">${closedOk} วัน</span></div>
    <div class="toprow"><span>ขาด</span><span class="tnum">${closedUnder} วัน</span></div>
    <div class="toprow"><span>เกิน</span><span class="tnum">${closedOver} วัน</span></div>
    <div class="toprow"><span>ผลต่างสะสม</span><span class="tnum">${diffSum>0?'+':''}${fmtMoney(diffSum)}</span></div>
    <div class="subgroup-label">สาเหตุยอดไม่ตรง (${mismatchDays.length} วัน)</div>
    ${mismatchDays.length===0 ? '<div class="empty-hint">ไม่มีวันที่ยอดไม่ตรงในช่วงนี้ 🎉</div>' : `
      ${reasonRows.map(([reason,c])=>`<div class="perbar"><span>${escapeHtml(reason)}</span><span class="tnum">${c} วัน</span></div>`).join('')}
      <div class="subgroup-label" style="margin-top:14px;">รายวัน</div>
      ${mismatchDays.map(d=>`<div class="toprow diffday" data-jumpdate="${d.date}"><span>${fmtDateThaiShort(d.date)} · ${d.diff>0?'⬆️ เกิน':'⬇️ ขาด'} ${fmtMoney(Math.abs(d.diff))}</span><span style="color:${d.reason?'var(--ink-dim)':'var(--warn)'};font-size:12.5px;text-align:right;">${escapeHtml(d.reason||'ไม่ทราบสาเหตุ')}</span></div>`).join('')}
    `}
    <div class="subgroup-label">จำนวนวันลา</div>
    ${leaveRows.length? leaveRows.map(([nm,c])=>`<div class="perbar"><span>${escapeHtml(nm)}</span><span class="tnum">${c} วัน</span></div>`).join('') : '<div class="empty-hint">ไม่มีวันลา</div>'}
    <div class="subgroup-label">จำนวนวันทำงานพาร์ทไทม์</div>
    ${workRows.length? workRows.map(([nm,c])=>`<div class="perbar"><span>${escapeHtml(nm)}</span><span class="tnum">${c} วัน</span></div>`).join('') : '<div class="empty-hint">ไม่มีพาร์ทไทม์</div>'}
    <div class="btnrow"><button class="btn secondary" id="sum-export">Export ช่วงนี้</button></div>
  `;
  document.getElementById('sum-export').onclick=()=>exportRange(from,to);
  document.querySelectorAll('[data-jumpdate]').forEach(r=>r.onclick=async()=>{
    await gotoTab('today'); await renderDate(r.dataset.jumpdate); jumpToSection('closing');
  });
}

  host.querySelectorAll('[data-dow]').forEach(b=>b.onclick=async()=>{
    const [field,idx]=b.dataset.dow.split(':'); const i=+idx;
    const arr=new Set(SETTINGS[field]);
    if(arr.has(i)) arr.delete(i); else arr.add(i);
    SETTINGS[field]=[...arr].sort();
    await dbPut('settings',SETTINGS); await renderSettings();
  });
  const bindNum=(id,field)=>document.getElementById(id).onchange=async(e)=>{ SETTINGS[field]=clampInt(e.target.value,1); await dbPut('settings',SETTINGS); toast('บันทึกแล้ว'); };
  bindNum('s-defaultMeal','defaultMeal'); bindNum('s-defaultFloat','defaultFloat'); bindNum('s-parkingWage','parkingWage'); bindNum('s-parkingMealCount','parkingMealCount');
  document.getElementById('s-reminderTime').onchange=async(e)=>{ SETTINGS.reminderTime=e.target.value; await dbPut('settings',SETTINGS); };
  document.getElementById('exp-xlsx').onclick=()=>exportRange(null,null,'xlsx');
  document.getElementById('exp-csv').onclick=()=>exportRange(null,null,'csv');
  document.getElementById('exp-json').onclick=fullBackupExport;
  document.getElementById('imp-json').onclick=()=>document.getElementById('imp-file').click();
  document.getElementById('imp-file').onchange=(e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); };
}

async function moveStaff(id,dir){
  const s=STAFF.find(x=>x.id===id);
  const siblings=STAFF.filter(x=>x.group===s.group).sort((a,b)=>a.order-b.order);
  const idx=siblings.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=siblings.length) return;
  const other=siblings[swapIdx];
  const tmp=s.order; s.order=other.order; other.order=tmp;
  await dbPut('staff',s); await dbPut('staff',other);
  await renderSettings();
}
async function moveFavExpense(id,dir){
  const list=[...FAVEXP].sort((a,b)=>a.order-b.order);
  const idx=list.findIndex(x=>x.id===id);
  const swapIdx=idx+dir;
  if(swapIdx<0||swapIdx>=list.length) return;
  const a=list[idx], b=list[swapIdx];
  const tmp=a.order; a.order=b.order; b.order=tmp;
  await dbPut('favExpenses',a); await dbPut('favExpenses',b);
  await renderSettings();
}

function openStaffSheet(id){
  const editing=!!id; const s=editing?STAFF.find(x=>x.id===id):null;
  openSheet(editing?'แก้ไขพนักงาน':'เพิ่มพนักงาน',(body)=>{
    body.innerHTML=`
      <div class="field"><label>ชื่อ</label><input type="text" id="st-name" value="${editing?escapeHtml(s.name):''}"></div>
      <div class="field"><label>กลุ่ม</label><div class="seg" id="st-group">
        <button data-g="front" class="${(!editing||s.group==='front')?'on':''}">หน้าร้าน</button>
        <button data-g="kitchen" class="${editing&&s.group==='kitchen'?'on':''}">ในครัว</button>
        <button data-g="parking" class="${editing&&s.group==='parking'?'on':''}">โบกรถ</button></div></div>
      <div class="field"><label>ประเภท</label><div class="seg" id="st-type">
        <button data-t="regular" class="${(!editing||s.type==='regular')?'on':''}">ประจำ</button>
        <button data-t="frequent" class="${editing&&s.type==='frequent'?'on':''}">พาร์ทไทม์บ่อย</button></div></div>
      ${editing?`<label class="checkline"><input type="checkbox" id="st-active" ${s.active?'checked':''}>ใช้งานอยู่ (ปิดแทนการลบถ้าลาออก)</label>`:''}
      ${!editing?`<div class="hint">คนใหม่ที่เป็น "ประจำ" จะถูกเพิ่มเข้าค่าข้าวของวันนี้ (ถ้ายังไม่ปิดยอด) ให้อัตโนมัติ</div>`:''}
      <div class="btnrow"><button class="btn primary" id="st-save">บันทึก</button></div>`;
    let g=editing?s.group:'front', t=editing?s.type:'regular';
    document.querySelectorAll('#st-group button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#st-group button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); g=b.dataset.g; });
    document.querySelectorAll('#st-type button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#st-type button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); t=b.dataset.t; });
    document.getElementById('st-save').onclick=async()=>{
      const name=document.getElementById('st-name').value.trim();
      if(!name){ toast('กรุณากรอกชื่อ'); return; }
      let rec;
      if(editing){ s.name=name; s.group=g; s.type=t; s.active=document.getElementById('st-active').checked; await dbPut('staff',s); rec=s; }
      else { rec={id:uuid(),name,group:g,type:t,active:true,order:STAFF.filter(x=>x.group===g).length}; await dbPut('staff',rec); }
      await backfillRegularStaffToOpenDays(rec);
      closeSheet(); await renderSettings();
    };
  });
}

// keeps already-created (but not-yet-closed) days in sync when a "regular" staff member
// is added, reactivated, or switched to "ประจำ" from Settings — otherwise they'd only
// start appearing in mealEntries the next time a brand-new day is auto-created.
async function backfillRegularStaffToOpenDays(staff){
  if(staff.type!=='regular' || !staff.active) return;
  const days=await dbGetAll('days');
  for(const day of days.filter(d=>d.status==='open')){
    const existing=await dbGetByIndex('mealEntries','dayId',day.id);
    if(existing.some(m=>m.staffId===staff.id)) continue;
    await dbPut('mealEntries',{id:uuid(),dayId:day.id,staffId:staff.id,nameSnapshot:staff.name,group:staff.group,status:'pending',amount:SETTINGS.defaultMeal,tripId:null});
  }
}

/* ===================== EXPORT / BACKUP ===================== */
function downloadBlob(blob,filename){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
}
function csvEscape(v){ v=v==null?'':String(v); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function rowsToCSV(headers,rows){
  const lines=[headers.join(',')];
  for(const r of rows) lines.push(headers.map(h=>csvEscape(r[h])).join(','));
  return '\uFEFF'+lines.join('\r\n');
}
let sheetJSPromise=null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  if(sheetJSPromise) return sheetJSPromise;
  sheetJSPromise=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  return sheetJSPromise;
}

async function buildExportTables(from,to){
  let days=await dbGetAll('days');
  if(from&&to) days=days.filter(d=>d.date>=from&&d.date<=to);
  days.sort((a,b)=>a.date<b.date?-1:1);
  const Days=[],Meals=[],MealTrips=[],Expenses=[],Loans=[],Receivables=[],DailySummary=[];
  for(const day of days){
    const ctx=await dayCtx(day.id);
    const mt=mealTotal(ctx.meals), et=expenseTotal(ctx.expenses);
    const total=(day.remainingCash||0)+et+mt;
    const hasAll=day.remainingCash!=null&&day.posCash!=null;
    const diff=hasAll?total-day.posCash:'';
    Days.push({date:day.date,float:day.float,floatNote:day.floatNote,setAside:day.setAside,remainingCash:day.remainingCash,posCash:day.posCash,status:day.status,closedAt:day.closedAt,isSpecialOpen:day.isSpecialOpen,note:day.note});
    for(const m of ctx.meals) Meals.push({date:day.date,name:m.nameSnapshot,group:m.group,status:m.status,amount:m.amount,tripId:m.tripId||''});
    for(const t of ctx.trips) MealTrips.push({date:day.date,buyer:t.buyer,taken:t.taken,change:t.change,spent:t.spent,time:t.time,members:t.memberEntryIds.map(id=>{const m=ctx.meals.find(x=>x.id===id);return m?m.nameSnapshot:'';}).join('|'),photos:(t.attachmentIds||[]).length});
    for(const e of ctx.expenses){
      if(e.category==='parkingWage'){ Expenses.push({date:day.date,name:e.name,itemCategory:'',amount:e.amount,taken:e.taken,change:e.change,roundCategory:'parkingWage',status:'settled',paid:e.paid,time:e.time}); continue; }
      if(e.status==='advance'){ Expenses.push({date:day.date,name:`(เบิกไป — ${e.takenBy||''})`,itemCategory:'',amount:'',taken:e.taken,change:'',roundCategory:'general',status:'advance',paid:'',time:e.time}); continue; }
      for(const it of expenseItems(e)) Expenses.push({date:day.date,name:it.name,itemCategory:it.category||'',amount:it.amount,taken:e.taken,change:e.change,roundCategory:'general',status:'settled',paid:'',time:e.time});
    }
    for(const l of ctx.loans) Loans.push({date:day.date,lender:l.lender,amount:l.amount,reason:l.reason,repaid:l.repaid});
    for(const r of ctx.recv) Receivables.push({date:day.date,borrower:r.borrower,amount:r.amount,reason:r.reason,returned:r.returned});
    DailySummary.push({date:day.date,weekday:THAI_WD[dowOf(day.date)],float:day.float,floatNote:day.floatNote,setAside:day.setAside,remainingCash:day.remainingCash,
      mealTotal:mt,expenseTotal:et,total,posCash:day.posCash,diff,result:!hasAll?'':(diff===0?'ตรง':diff>0?'เกิน':'ขาด'),diffReason:day.diffReason||'',closedAt:day.closedAt});
  }
  return {Days,Meals,MealTrips,Expenses,Loans,Receivables,DailySummary};
}

async function markBackedUp(){ SETTINGS.lastBackupAt=nowISO(); await dbPut('settings',SETTINGS); }

async function exportRange(from,to,format){
  format = format || 'xlsx';
  const tabs=await buildExportTables(from,to);
  const stamp=todayISO();
  if(format==='xlsx'){
    toast('กำลังเตรียมไฟล์ Excel...');
    await loadSheetJS();
    const wb=XLSX.utils.book_new();
    for(const name of ['Days','Meals','MealTrips','Expenses','Loans','Receivables','DailySummary']){
      const ws=XLSX.utils.json_to_sheet(tabs[name]);
      XLSX.utils.book_append_sheet(wb,ws,name);
    }
    XLSX.writeFile(wb,`restaurant-log-${stamp}.xlsx`);
  } else {
    for(const name of ['Days','Meals','MealTrips','Expenses','Loans','Receivables','DailySummary']){
      const rows=tabs[name]; if(rows.length===0) continue;
      const headers=Object.keys(rows[0]);
      const csv=rowsToCSV(headers,rows);
      downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`${name}-${stamp}.csv`);
      await new Promise(r=>setTimeout(r,180));
    }
  }
  await markBackedUp();
  toast('สำรองข้อมูลแล้ว');
}

function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
}
function base64ToBlob(dataUrl){
  return fetch(dataUrl).then(r=>r.blob());
}
async function fullBackupExport(){
  toast('กำลังสำรองข้อมูล...');
  const [settings,staff,days,mealEntries,mealTrips,expenses,loans,receivables,attachments]=await Promise.all(
    ['settings','staff','days','mealEntries','mealTrips','expenses','loans','receivables','attachments'].map(dbGetAll));
  const attOut=[];
  for(const a of attachments){ attOut.push({id:a.id,mime:a.mime,parentType:a.parentType,parentId:a.parentId,data:await blobToBase64(a.blob)}); }
  const data={version:1,exportedAt:nowISO(),settings,staff,days,mealEntries,mealTrips,expenses,loans,receivables,attachments:attOut};
  downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),`backup-${todayISO()}.json`);
  await markBackedUp();
  toast('สำรองเต็มเสร็จแล้ว');
}
async function importBackup(file){
  const text=await file.text();
  let data; try{ data=JSON.parse(text); }catch(e){ toast('ไฟล์ไม่ถูกต้อง'); return; }
  openDialog(`<h3>นำเข้าข้อมูลสำรอง</h3>
    <p style="font-size:13.5px;color:var(--ink-dim);">พบ ${((data.days||[]).length)} วัน และรูป ${((data.attachments||[]).length)} รูปในไฟล์นี้ ต้องการนำเข้าแบบไหน?</p>
    <div class="btnrow" style="flex-direction:column;">
      <button class="btn danger" id="imp-replace">แทนที่ทั้งหมด</button>
      <button class="btn secondary" id="imp-merge">รวมเข้า (เก็บของเดิมไว้ถ้าซ้ำ id)</button>
      <button class="btn ghost" id="imp-cancel">ยกเลิก</button>
    </div>`);
  document.getElementById('imp-cancel').onclick=closeDialog;
  document.getElementById('imp-replace').onclick=()=>doImport(data,true);
  document.getElementById('imp-merge').onclick=()=>doImport(data,false);
}
async function doImport(data,replace){
  closeDialog(); toast('กำลังนำเข้า...');
  const stores=['days','mealEntries','mealTrips','expenses','loans','receivables','staff'];
  if(replace){
    for(const st of stores){ const all=await dbGetAll(st); for(const r of all) await dbDelete(st,r.id); }
    const allAtt=await dbGetAll('attachments'); for(const a of allAtt) await dbDelete('attachments',a.id);
  }
  for(const st of stores){
    for(const rec of (data[st]||[])){
      if(!replace){ const existing=await dbGet(st,rec.id); if(existing) continue; }
      await dbPut(st,rec);
    }
  }
  for(const a of (data.attachments||[])){
    if(!replace){ const existing=await dbGet('attachments',a.id); if(existing) continue; }
    const blob=await base64ToBlob(a.data);
    await dbPut('attachments',{id:a.id,blob,mime:a.mime,parentType:a.parentType,parentId:a.parentId});
  }
  if(data.settings){ if(replace) await dbPut('settings',{...data.settings,id:'main'}); }
  await refreshSettings(); await refreshStaff();
  toast('นำเข้าข้อมูลเสร็จแล้ว');
  await renderDate(curDate); await gotoTab(curTab);
}

/* ===================== NOTIFICATIONS ===================== */
async function maybeRollToToday(){
  const nowToday=todayISO();
  if(nowToday!==lastKnownToday){
    const wasOnToday = (curDate===lastKnownToday); // only auto-advance if they weren't off looking at some other date
    lastKnownToday=nowToday;
    if(wasOnToday){ await renderDate(nowToday); }
  }
}
async function reminderIssuesForToday(){
  const dateStr=todayISO();
  if(isClosedWeekday(dateStr)){ const d=await dbGetByDate(dateStr); if(!d) return []; }
  const day=await dbGetByDate(dateStr);
  if(!day || day.status!=='open') return [];
  const ctx=await dayCtx(day.id);
  // reuse the same list as the overview card's "ห้ามลืม" checklist, but skip the
  // "pending meal" line here — that one is only useful while looking at the day itself.
  return pendingIssuesFor(day,ctx).filter(i=>i.key!=='meal').map(i=>({anchor:i.key,text:'⚠️ '+i.text}));
}
function timeNowHM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
async function checkNotifications(){
  await maybeRollToToday();
  const issues=await reminderIssuesForToday();
  const dot=document.getElementById('dot-today');
  dot.classList.toggle('hide', issues.length===0);
  const banners=document.getElementById('banners');
  banners.innerHTML='';
  const pastReminder = timeNowHM() >= (SETTINGS.reminderTime||'19:30');
  if(pastReminder && issues.length){
    const b=el('div','banner warn', issues.map(i=>i.text).join(' · '));
    b.onclick=async()=>{ await gotoTab('today'); await renderDate(todayISO()); jumpToSection(issues[0].anchor); };
    banners.appendChild(b);
  }
  const staleDays = SETTINGS.lastBackupAt ? (Date.now()-new Date(SETTINGS.lastBackupAt).getTime())/86400000 : Infinity;
  if(staleDays>7){
    const days = SETTINGS.lastBackupAt ? Math.floor(staleDays) : '—';
    const b=el('div','banner muted', `ยังไม่ได้สำรองข้อมูลมา ${days} วัน`);
    b.onclick=()=>gotoTab('settings');
    banners.appendChild(b);
  }
}
async function refreshTodayDot(){ await checkNotifications(); }
function startNotifLoop(){
  checkNotifications();
  notifTimer=setInterval(checkNotifications,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkNotifications(); });
}

/* ===================== INIT ===================== */
boot();
